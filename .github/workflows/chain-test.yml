name: chain-test
on:
  push:
  workflow_dispatch:
    inputs:
      depth:
        description: depth
        required: false
        default: "0"
permissions:
  actions: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next
        env:
          GH_TOKEN: ${{ github.token }}
          DEPTH: ${{ github.event.inputs.depth }}
        run: |
          echo "depth=${DEPTH:-0}"
          if [ "${DEPTH:-0}" = "0" ]; then
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/chain-test.yml/dispatches" \
              -d '{"ref":"main","inputs":{"depth":"1"}}')
            echo "dispatch HTTP $code"
            cat /tmp/resp.txt
          fi

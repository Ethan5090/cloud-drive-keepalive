name: Cloud Drive Keepalive

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write

concurrency:
  group: cloud-drive-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 5 minutes
        env:
          TARGET: https://37jbdm0m5grahydvlkr.traesite.cn/healthz
        run: |
          end=$(( $(date +%s) + 20400 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$((n+1))
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$TARGET" || true)
            echo "ping #$n $(date -u +%FT%TZ) HTTP $code"
            sleep 300
          done

      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/keepalive.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "chain dispatch HTTP $code"
          cat /tmp/resp.txt
